
<svg xmlns="http://www.w3.org/2000/svg"
     width="900" height="55"
     viewBox="0 0 900 55">

  <defs>
    <linearGradient id="binaryGradient"
                    x1="0" y1="0"
                    x2="900" y2="0"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9D7CFF"/>
      <stop offset="50%" stop-color="#B58AFF"/>
      <stop offset="100%" stop-color="#47C8FF"/>
    </linearGradient>

    <clipPath id="clip">
      <rect x="20" y="0" width="860" height="55"/>
    </clipPath>

    <pattern id="binaryPattern"
             width="480" height="55"
             patternUnits="userSpaceOnUse">

      <text x="0" y="34"
            font-family="monospace"
            font-size="17"
            font-weight="bold"
            letter-spacing="3"
            fill="white"
            textLength="480"
            lengthAdjust="spacingAndGlyphs">10110100101101011001011010100110</text>

    </pattern>

    <mask id="binaryMask">
      <rect width="900" height="55"
            fill="url(#binaryPattern)"/>
    </mask>
  </defs>

  <!-- Flux binaire continu -->
  <g clip-path="url(#clip)">

    <g mask="url(#binaryMask)">
      <rect x="0" y="0"
            width="900" height="55"
            fill="url(#binaryGradient)"/>
    </g>

    <!-- Ligne de transmission -->
    <rect x="20" y="42"
          width="860" height="1"
          fill="url(#binaryGradient)"
          opacity="0.4"/>

  </g>

  <!-- Defilement continu -->
  <animateTransform
    href="#binaryPattern"
    attributeName="patternTransform"
    type="translate"
    from="0 0"
    to="480 0"
    dur="8s"
    repeatCount="indefinite"/>

</svg>
