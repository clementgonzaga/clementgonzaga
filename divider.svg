
<svg xmlns="http://www.w3.org/2000/svg"
     width="900" height="36"
     viewBox="0 0 900 36">

  <defs>
    <linearGradient id="lineGradient"
                    x1="0" y1="0" x2="900" y2="0"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9D7CFF"/>
      <stop offset="50%" stop-color="#B58AFF"/>
      <stop offset="100%" stop-color="#47C8FF"/>
    </linearGradient>
  </defs>

  <!-- Ligne avec dégradé violet vers bleu -->
  <rect x="20" y="17" width="860" height="2"
        rx="1" fill="url(#lineGradient)" />

  <!-- Point violet animé -->
  <circle cx="20" cy="18" r="5" fill="#9D7CFF">
    <animate attributeName="cx"
             values="20;880;20"
             dur="6s"
             repeatCount="indefinite"/>
  </circle>

  <!-- Point bleu animé -->
  <circle cx="880" cy="18" r="3.5" fill="#47C8FF">
    <animate attributeName="cx"
             values="880;20;880"
             dur="8s"
             repeatCount="indefinite"/>
  </circle>

</svg>
